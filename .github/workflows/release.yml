name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build MARS Windows Installer
        shell: powershell
        run: |
          npm run build:installer

      - name: Verify Installer Exists
        shell: powershell
        run: |
          Get-Item dist\MARS_Setup_v1.1.0.exe | Format-List

      - name: Create GitHub Release and Upload Installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: MARS Music Aggregator ${{ github.ref_name || 'v1.1.0' }}
          draft: false
          prerelease: false
          body: |
            ## 🎧 MARS — Multi-Platform Music Aggregator
            
            Платформа, объединяющая все музыкальные каталоги мира, чарты и способы воспроизведения (Яндекс Музыка / Spotify альтернатива).
            
            ### 🚀 Что нового:
            - Поиск по 100+ миллионам треков со всего мира.
            - Интеграция мировых чартов и горячих новинок недели.
            - Выбор источников воспроизведения: Apple Music, YouTube Music, SoundCloud, Jamendo.
            - Автоматическое добавление треков в локальную базу.
            - Регистрация и вход по Email или номеру телефона.
            
            ### 📥 Установка для Windows:
            Скачайте файл **`MARS_Setup_v1.1.0.exe`** ниже и установите программу в один клик.
          files: |
            dist/MARS_Setup_v1.1.0.exe
