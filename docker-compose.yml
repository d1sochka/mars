services:
  postgres:
    image: postgres:16-alpine
    container_name: mars_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mars_user
      POSTGRES_PASSWORD: mars_password
      POSTGRES_DB: mars_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars_user -d mars_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
