services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mars_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://mars.yourdomain.com
      - DATABASE_URL=postgresql://mars_user:mars_password@postgres:5432/mars_db?schema=public
      - NEXTAUTH_SECRET=mars_super_secret_production_key_32_chars_min
      - JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID}
      - SOUNDCLOUD_CLIENT_ID=${SOUNDCLOUD_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: mars_postgres
    restart: always
    environment:
      POSTGRES_USER: mars_user
      POSTGRES_PASSWORD: mars_password
      POSTGRES_DB: mars_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars_user -d mars_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
